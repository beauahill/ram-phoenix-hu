plugins {
    id 'com.android.application'
}

// Google Maps key: read from the repo-root local.properties (gitignored) or the
// MAPS_API_KEY env var. Never commit it. Empty key = map renders a blank grid.
def mapsKey = System.getenv('MAPS_API_KEY') ?: ''
def lp = rootProject.file('../../local.properties')
if (!mapsKey && lp.exists()) {
    def p = new Properties()
    lp.withInputStream { p.load(it) }
    mapsKey = p.getProperty('MAPS_API_KEY', '')
}
if (!mapsKey) logger.warn('WARNING: MAPS_API_KEY not set; map card will be blank on device')

android {
    namespace 'com.ramphoenix.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ramphoenix.launcher'
        minSdk 31
        targetSdk 33
        versionCode 8
        versionName '0.5.1'
        manifestPlaceholders = [MAPS_API_KEY: mapsKey]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Our own UI stays on plain framework widgets (small cold start). Play Services
    // pulls androidx.fragment/core transitively; that's the price of the real Google map.
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    testImplementation 'junit:junit:4.13.2'
}
