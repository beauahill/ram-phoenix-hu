plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ramphoenix.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ramphoenix.launcher'
        minSdk 31
        targetSdk 33
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Deliberately no AndroidX: plain framework widgets keep the home screen's
    // cold start small on the head unit. osmdroid = key-free OpenStreetMap tiles.
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
