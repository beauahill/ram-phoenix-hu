plugins {
    id 'com.android.application'
}

// Google Maps key: read from the repo-root local.properties (gitignored) or the
// MAPS_API_KEY env var. Never commit it. Empty key = map renders a blank grid.
def mapsKey = System.getenv('MAPS_API_KEY') ?: ''
def lp = rootProject.file('../../local.properties')
if (!mapsKey && lp.exists()) {
    def p = new Properties()
    lp.withInputStream { p.load(it) }
    mapsKey = p.getProperty('MAPS_API_KEY', '')
}
if (!mapsKey) logger.warn('WARNING: MAPS_API_KEY not set; map card will be blank on device')

android {
    namespace 'com.ramphoenix.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ramphoenix.launcher'
        minSdk 31
        targetSdk 33
        versionCode 21
        versionName '0.5.14'
        testInstrumentationRunner 'com.ramphoenix.launcher.PaneWindowProbe'
        manifestPlaceholders = [MAPS_API_KEY: mapsKey]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Our own UI stays on plain framework widgets (small cold start). Play Services
    // pulls androidx.fragment/core transitively; that's the price of the real Google map.
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    testImplementation 'junit:junit:4.13.2'
    // Real JSON implementation for migration/round-trip tests; Android supplies runtime JSON.
    testImplementation 'org.json:json:20240303'
}

// Compile the shell companion from source for every relevant build. No prebuilt
// helper or workstation credentials are shipped in the repository.
def bridgeClasses = layout.buildDirectory.dir('windowBridge/classes')
def bridgeDex = layout.buildDirectory.dir('windowBridge/dex')
def bridgeAssets = layout.buildDirectory.dir('generated/windowBridgeAssets')
def compileBridge = tasks.register('compileWindowBridge', JavaCompile) {
    source rootProject.fileTree('../windowbridge/src') { include '**/*.java' }
    source rootProject.fileTree('../windowbridge/shared') { include '**/*.java' }
    classpath = files(android.bootClasspath)
    destinationDirectory = bridgeClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}
def dexBridge = tasks.register('dexWindowBridge', JavaExec) {
    dependsOn compileBridge
    inputs.dir(bridgeClasses)
    outputs.dir(bridgeDex)
    classpath = files("${android.sdkDirectory}/build-tools/34.0.0/lib/d8.jar")
    mainClass = 'com.android.tools.r8.D8'
    doFirst {
        bridgeDex.get().asFile.mkdirs()
        args = ['--lib', "${android.sdkDirectory}/platforms/android-34/android.jar",
                '--min-api', '31', '--output', bridgeDex.get().asFile.absolutePath]
        args += fileTree(bridgeClasses).matching { include '**/*.class' }.files.collect { it.absolutePath }
    }
}
def packageBridge = tasks.register('packageWindowBridge', Zip) {
    dependsOn dexBridge
    from bridgeDex
    include 'classes.dex'
    archiveFileName = 'window_bridge.jar'
    destinationDirectory = bridgeAssets
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
android.sourceSets.main.assets.srcDir(bridgeAssets)
android.sourceSets.main.java.srcDir(rootProject.file('../windowbridge/shared'))
tasks.named('preBuild').configure { dependsOn packageBridge }
